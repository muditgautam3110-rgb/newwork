# Orderly CI — FIXME(T6): this workflow has several deliberate defects.
# Make it a pipeline that would actually run the test suite on every push.
name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pytest
        env:
          PYTHON_VERSION: "2.7"
